name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Serve per poter pubblicare la Release qui sotto: senza, il token di default
# di Actions non ha il permesso di crearla.
permissions:
  contents: write

jobs:
  build:
    name: Test e APK di debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepara il keystore, se configurato
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kids.jks"
            echo "Keystore pronto: l'APK sarà firmato in modo stabile."
          else
            echo "Nessun keystore nei secret: APK con firma di debug usa e getta."
          fi

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compila l'APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kids.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Allega l'APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rinomina l'APK per la Release
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk kids-tracker.apk

      # Un file .apk scaricato direttamente si installa con un tocco: niente
      # zip da estrarre, il problema che ha bloccato il download precedente.
      # Un'unica release "ultima-build" viene aggiornata a ogni push, così
      # c'è sempre un solo link fisso da tenere nei preferiti sul telefono.
      - name: Pubblica l'APK come Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-build
          name: Ultima build
          body: |
            APK generato automaticamente a ogni push su ${{ github.ref_name }}.
            Scarica `kids-tracker.apk` e installalo: si aggiorna sopra la
            versione già installata, senza perdere i dati.

            Commit: ${{ github.sha }}
          files: kids-tracker.apk
          make_latest: true

      - name: Allega i report dei test se qualcosa è rosso
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: app/build/reports/tests/
          if-no-files-found: ignore
