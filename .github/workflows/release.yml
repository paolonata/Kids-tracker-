name: Release

# Su un tag "v*" costruisce l'APK e lo allega alla release di GitHub,
# così si scarica dal telefono e si installa.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepara il keystore, se configurato
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kids.jks"
            echo "firmata=si" >> "$GITHUB_OUTPUT"
          else
            echo "firmata=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kids.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.firma.outputs.firmata }}" = "si" ]; then
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk kids-tracker.apk
          else
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk kids-tracker.apk
          fi

      - name: Pubblica sulla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "APK di Kids Tracker."
          gh release upload "$TAG" kids-tracker.apk --clobber
